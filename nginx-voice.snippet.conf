    # Voice inbox — iOS Shortcuts audio drop
    # Auth via Authorization: Bearer <token> checked inside the app
    location /voice {
        proxy_pass http://127.0.0.1:8790;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 50M;
        proxy_read_timeout 120s;
        proxy_request_buffering off;
    }

    location = /voice/health {
        proxy_pass http://127.0.0.1:8790/health;
    }

    # Web clipper — bookmarklet form-POST + JSON. Saves to ~/vault/links/.
    # Auth via bearer header OR a `token` form field, checked inside the app.
    # The `/clip` prefix covers both POST /clip and GET /clip/setup.
    location /clip {
        proxy_pass http://127.0.0.1:8790;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 25M;   # rendered DOM of a heavy page can be a few MB
        proxy_read_timeout 60s;
        proxy_request_buffering off;
    }
